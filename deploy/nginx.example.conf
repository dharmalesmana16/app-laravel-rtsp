# Contoh Nginx server block utk app-laravel-rtsp.
# Sesuaikan: server_name, path root, php-fpm socket version, SSL cert path.
#
# Letakkan di /etc/nginx/sites-available/rtsp lalu symlink ke sites-enabled.

# Redirect HTTP -> HTTPS (publik)
server {
    listen 80;
    listen [::]:80;
    server_name rtsp.domainkamu.com;

    # /api/internal boleh diakses lokal (stream service) via HTTP loopback
    location /api/internal {
        allow 127.0.0.1;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rtsp.domainkamu.com;

    # === SSL (Let's Encrypt) ===
    ssl_certificate     /etc/letsencrypt/live/rtsp.domainkamu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtsp.domainkamu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/rtsp/public;
    index index.php index.html;

    client_max_body_size 20M;

    # === PROXY WebSocket stream ===
    # Browser connect wss://host/ws/{port}  ->  stream service localhost:{port}
    location ~ ^/ws/(?<port>[0-9]+)$ {
        allow all;                       # publik boleh (frame MPEG tanpa cred)
        proxy_pass http://127.0.0.1:$port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;        # WS idle tahan lama
        proxy_send_timeout 3600s;
    }

    # === Endpoint internal (hanya localhost — stream service) ===
    location /api/internal {
        allow 127.0.0.1;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # === Laravel ===
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # sesuaikan versi PHP
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $https_flag;
    }

    location ~ \.php$ {
        return 404;   # cegah eksekusi php di path lain
    }

    # Vite build assets (public/build)
    location /build {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\.(?!well-known).* { deny all; }   # sembunyikan .env dll
}
